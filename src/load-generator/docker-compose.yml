services:
  load-generator-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: load-generator:latest
    container_name: load-generator-1
    command: ["--url", "http://load-balancer:8080", "--concurrent", "100", "--duration", "120", "--log-level", "INFO"]
    networks:
      - mpeg-dash-network

